stages:
  - app_build
  - image_build
  - deploy
  - destroy_if_needed

frontendNG_build:
  stage: app_build
  image: node:16
  script:
    - cd frontend
    - npm install @types/node@16.11.7 --no-save
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

backendMVN_build:
  stage: app_build
  image: maven:3.8.5-openjdk-17
  script:
    - cd backend
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/*.jar

frontendNG_publish:
  stage: image_build
  image: docker:latest
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest .
    - docker push $CI_REGISTRY_IMAGE/frontend:latest

backendMVN_publish:
  stage: image_build
  image: docker:latest
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - cd backend
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest .
    - docker push $CI_REGISTRY_IMAGE/backend:latest
