{{- if and .Values.ingress .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-{{ .Values.helmReleaseNamefull }}
  annotations:
    # nginx.ingress.kubernetes.io/rewrite-target: /{{ .Values.typeEnv }}/
spec:
  ingressClassName: nginx
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: service-frontend-{{ .Values.helmReleaseNamefull }}
              port:
                number:  {{ .Values.frontend.port }}
{{- end }}