apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-{{ .Values.helmReleaseNamefull }}
  labels:
    app: frontend-{{ .Values.helmReleaseName }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: frontend-{{ .Values.helmReleaseName }}
  template:
    metadata:
      labels:
        app: frontend-{{ .Values.helmReleaseName }}
    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config-{{ .Values.helmReleaseNamefull }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-{{ .Values.helmReleaseNamefull }}
  labels:
    app: backend-{{ .Values.helmReleaseName }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend-{{ .Values.helmReleaseName }}
  template:
    metadata:
      labels:
        app: backend-{{ .Values.helmReleaseName }}
    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-{{ .Values.helmReleaseNamefull }}
  labels:
    app: postgres-{{ .Values.helmReleaseName }}
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  selector:
    matchLabels:
      app: postgres-{{ .Values.helmReleaseName }}
  template:
    metadata:
      labels:
        app: postgres-{{ .Values.helmReleaseName }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            {{- range $key, $value := .Values.postgres.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}